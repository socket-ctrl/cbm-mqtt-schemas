name: Schema CI

on:
  pull_request:
    paths:
      - "schema/**"
      - "docs/**"
  push:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验所有 schema 文件 JSON 语法与元数据
        shell: bash
        run: |
          fail=0
          for f in $(find schema -name '*.schema.json'); do
            # JSON 语法校验
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "::error file=$f::JSON 语法错误"; fail=1; continue; }
            # 元数据完整性（$ref 包装文件允许省略 type）
            node -e "
              const s = JSON.parse(require('fs').readFileSync('$f','utf8'));
              const need = ['\$schema','\$id','title','description'];
              const isWrapper = '\$ref' in s;
              if (!isWrapper && !('type' in s)) { console.error('$f 缺少字段: type'); process.exit(1); }
              const miss = need.filter(k => !(k in s));
              if (miss.length) { console.error('$f 缺少字段: ' + miss.join(',')); process.exit(1); }
              if (s.\$schema !== 'https://json-schema.org/draft/2020-12/schema') { console.error('$f \$schema 非 2020-12'); process.exit(1); }
            " || fail=1
          done
          exit $fail

      - name: ajv 编译校验（含 $ref 解析）
        run: |
          npm install --no-save ajv@8
          node -e '
            const fs = require("fs"), path = require("path");
            const Ajv = require("ajv/dist/2020").default;
            const files = [];
            (function walk(d){ for (const e of fs.readdirSync(d,{withFileTypes:true})) {
              const p = path.join(d, e.name);
              if (e.isDirectory()) walk(p);
              else if (e.name.endsWith(".schema.json")) files.push(p);
            }})("schema/v1.2");
            const ajv = new Ajv({ strict: false, allErrors: true });
            for (const f of files) ajv.addSchema(JSON.parse(fs.readFileSync(f, "utf8")));
            for (const f of files) {
              try { ajv.getSchema(JSON.parse(fs.readFileSync(f, "utf8")).$id); }
              catch (err) { console.error(`${f}: ${err.message}`); process.exitCode = 1; }
            }
            if (process.exitCode) process.exit(1);
            console.log(`OK: ${files.length} 个 schema 编译通过（含相互 $ref 解析）`);
          '

      - name: 历史版本目录不可变检查
        shell: bash
        run: |
          # 已发布版本（v1.2 及之前）在 main 上后不允许删除；此处检查 PR 是否删除了已存在的历史 schema 文件
          git fetch origin main --depth=1 || true
          deleted=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep '^schema/.*\.schema\.json$' | while read f; do
            [ ! -f "$f" ] && echo "$f"
          done)
          if [ -n "$deleted" ]; then
            echo "::error::检测到删除已发布的 schema 文件（历史版本不可变）:"; echo "$deleted"; exit 1
          fi
